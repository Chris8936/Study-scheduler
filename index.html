<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Scheduler</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #e5e5e5;
      padding: 20px 16px;
      margin: 0;
      line-height: 1.5;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 24px;
      text-align: center;
      color: #ffffff;
    }
    h2 {
      font-size: 1.2rem;
      margin: 28px 0 12px;
      color: #a3a3a3;
    }
    input, textarea {
      width: 100%;
      background: #1c1c1c;
      color: #fff;
      border: 1px solid #333;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 10px;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #3b82f6;
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      margin-right: 6px;
      margin-top: 8px;
    }
    button:active { background: #2563eb; }
    .session-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      padding: 16px;
      border-radius: 14px;
      margin-bottom: 14px;
    }
    .session-card strong {
      font-size: 1.15rem;
      color: #fff;
    }
    .meta {
      color: #a3a3a3;
      font-size: 0.95rem;
      margin: 4px 0;
    }
    .countdown {
      display: inline-block;
      margin: 6px 0;
      font-weight: 600;
    }
    .members {
      margin-top: 8px;
      font-size: 0.95rem;
      color: #86efac;
      line-height: 1.6;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.88);
      z-index: 100;
      padding: 20px;
    }
    .modal-content {
      background: #1a1a1a;
      padding: 24px;
      border-radius: 16px;
      max-width: 420px;
      margin: 60px auto 0;
      border: 1px solid #333;
    }
    .modal-content h3 {
      margin-top: 0;
      margin-bottom: 16px;
      color: #fff;
      font-size: 1.25rem;
    }
    #notes-text {
      background: #141414;
      border: 1px solid #2e2e2e;
      border-radius: 12px;
      padding: 16px;
      min-height: 220px;
      font-size: 16px;
      line-height: 1.6;
      resize: vertical;
      color: #e5e5e5;
    }
    #notes-text::placeholder {
      color: #666;
    }
    .empty {
      text-align: center;
      color: #777;
      margin-top: 30px;
    }
    .btn-cancel {
      background: #333;
    }
    .btn-danger {
      background: #ef4444;
    }
    .btn-danger:active {
      background: #dc2626;
    }
    .error-text {
      color: #f87171;
      font-size: 0.9rem;
      margin-top: -6px;
      margin-bottom: 10px;
      display: none;
    }
    #toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #1f1f1f;
      color: white;
      padding: 14px 22px;
      border-radius: 12px;
      border: 1px solid #333;
      font-size: 15px;
      z-index: 999;
      display: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      max-width: 90%;
      text-align: center;
    }
    #toast.show {
      display: block;
      animation: fadeInUp 0.3s ease;
    }
    #toast.success { border-color: #22c55e; }
    #toast.error { border-color: #ef4444; }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translate(-50%, 20px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
  </style>
</head>
<body>

  <h1>Study Scheduler</h1>

  <h2>Create Study Session</h2>
  <input type="text" id="session-title" placeholder="Session title (e.g. Maths)">
  <input type="datetime-local" id="session-time">
  <br>
  <button onclick="createSession()">Create Session</button>

  <h2>Upcoming Sessions</h2>
  <div id="sessions"><p class="empty">Loading...</p></div>

  <!-- Notes Modal -->
  <div id="notes-modal" class="modal">
    <div class="modal-content">
      <h3 id="notes-title">Session Notes</h3>
      <textarea id="notes-text" placeholder="Write shared notes here..."></textarea>
      <br>
      <button onclick="saveNotes()">Save Notes</button>
      <button class="btn-cancel" onclick="closeNotes()">Close</button>
    </div>
  </div>

  <!-- Join Modal -->
  <div id="join-modal" class="modal">
    <div class="modal-content">
      <h3>Join Session</h3>
      <input type="text" id="join-name" placeholder="Enter your name">
      <div id="join-error" class="error-text">This name is already in the session.</div>
      <br>
      <button onclick="confirmJoin()">Join</button>
      <button class="btn-cancel" onclick="closeJoin()">Cancel</button>
    </div>
  </div>

  <!-- Delete Modal -->
  <div id="delete-modal" class="modal">
    <div class="modal-content">
      <h3>Delete Session</h3>
      <p style="margin-bottom: 20px; color: #ccc;">Are you sure you want to delete this session? This cannot be undone.</p>
      <button class="btn-danger" onclick="confirmDelete()">Delete</button>
      <button class="btn-cancel" onclick="closeDelete()">Cancel</button>
    </div>
  </div>

  <div id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
